<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!--
    ARACHNE - background art for the grub-themes "arachne" theme.

    Comic-print look: Ben-Day halftone dots, speed lines out of the emblem, an
    orb web slung across the corner, and a colour plate printed out of register
    (the cyan ghost behind the red spider). All original vector work.

    Re-render with `grub-themes build arachne`.
  -->
  <defs>
    <radialGradient id="sky" cx="28%" cy="40%" r="88%">
      <stop offset="0%"   stop-color="#271350"/>
      <stop offset="46%"  stop-color="#160b30"/>
      <stop offset="100%" stop-color="#08040f"/>
    </radialGradient>

    <!-- Ben-Day dots: two plates at different pitches, as a comic press would -->
    <pattern id="dotsMag" patternUnits="userSpaceOnUse" width="20" height="20">
      <circle cx="10" cy="10" r="3.6" fill="#ff2e63"/>
    </pattern>
    <pattern id="dotsCyan" patternUnits="userSpaceOnUse" width="28" height="28"
             patternTransform="rotate(18)">
      <circle cx="14" cy="14" r="3.2" fill="#2bd9ff"/>
    </pattern>
    <radialGradient id="maskMag" cx="30%" cy="58%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="maskCyan" cx="74%" cy="8%" r="58%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <mask id="mMag"><rect width="1920" height="1080" fill="url(#maskMag)"/></mask>
    <mask id="mCyan"><rect width="1920" height="1080" fill="url(#maskCyan)"/></mask>

    <radialGradient id="flare" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ff2e63" stop-opacity="0.34"/>
      <stop offset="52%"  stop-color="#7a1bff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7a1bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%"   stop-color="#08040f" stop-opacity="0.82"/>
      <stop offset="55%"  stop-color="#08040f" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#08040f" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vig" cx="42%" cy="52%" r="78%">
      <stop offset="52%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>

    <g id="spider">
      <g fill="none" stroke="currentColor" stroke-linecap="round">
        <path d="M 22 -26 C 64 -74, 110 -94, 152 -92" stroke-width="14"/>
        <path d="M 152 -92 C 188 -90, 206 -62, 208 -6" stroke-width="9"/>
        <path d="M 24 -8  C 72 -44, 128 -58, 172 -50"  stroke-width="14"/>
        <path d="M 172 -50 C 208 -44, 228 -14, 230 44"  stroke-width="9"/>
        <path d="M 24 8   C 74 -4,  132 -6,  176 8"    stroke-width="14"/>
        <path d="M 176 8  C 210 18, 226 46, 226 100"    stroke-width="9"/>
        <path d="M 20 22  C 66 34,  114 52, 148 78"    stroke-width="14"/>
        <path d="M 148 78 C 176 100, 186 126, 184 158"  stroke-width="9"/>
      </g>
      <g fill="currentColor">
        <ellipse cx="0" cy="-20" rx="30" ry="23"/>
        <ellipse cx="0" cy="34" rx="42" ry="58"/>
      </g>
    </g>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <circle cx="585" cy="618" r="500" fill="url(#flare)"/>

  <rect width="1920" height="1080" fill="url(#dotsMag)"  mask="url(#mMag)"  opacity="0.24"/>
  <rect width="1920" height="1080" fill="url(#dotsCyan)" mask="url(#mCyan)" opacity="0.16"/>

