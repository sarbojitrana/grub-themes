# Theme manifest. `grub-themes lint` validates it.

[theme]
id          = "arachne"
name        = "Arachne"
description = "Comic multiverse: halftone dots, speed lines, an off-register spider."
version     = "1.0.0"
license     = "MIT"
tags        = ["comic", "spider", "magenta", "cyan", "loud"]

[author]
name   = "Sarbojit Rana"
github = "sarbojitrana"

[files]
entry   = "theme.txt"
preview = "preview.png"

[display]
# What the art was drawn for; GRUB scales it, and theme.txt is in percentages.
designed_for = "1920x1080"
aspect       = "16:9"

# --- assets: `grub-themes build arachne` generates all of these -----------

[assets.background]
source = "tools/background.svg"
width  = 1920
height = 1080

[assets.selection]
# Comic print: the cyan plate a few millimetres out of register.
style     = "pill"
fill      = "#e01b45"
text      = "#ffffff"
radius    = 6
height    = 46          # keep equal to item_height in theme.txt
shadow    = "#2bd9ff"
shadow_dx = -7
shadow_dy = 6

[assets.terminal_box]
# Transparent: GRUB draws this box while the kernel loads (see AGENTS.md).
fill = "transparent"

[assets.progress]
track = "#1c0f38e6"
fill  = "#2bd9ff"

[assets.fonts]
# build prints the baked names; theme.txt must use those exactly.
regular    = "JetBrainsMonoNerdFont-Regular.ttf"
bold       = "JetBrainsMonoNerdFont-Bold.ttf"
prefix     = "jetbrains"
sizes      = [12, 14, 20]
bold_sizes = [18]
