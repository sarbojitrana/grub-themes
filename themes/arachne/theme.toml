# Theme manifest. Every theme in themes/ needs one of these.
# `grub-themes lint` validates it; the browser reads it to build the list.

[theme]
id          = "arachne"
name        = "Arachne"
description = "Comic multiverse: halftone dots, speed lines, an off-register spider."
version     = "1.0.0"
license     = "MIT"
tags        = ["comic", "spider", "magenta", "cyan", "loud"]

[author]
name   = "Sarbojit Rana"
github = "sarbojitrana"

[files]
entry   = "theme.txt"
preview = "preview.png"

[display]
# The resolution the art was drawn for. GRUB scales the background and the
# layout in theme.txt is in percentages, so other 16:9 modes work unchanged.
designed_for = "1920x1080"
aspect       = "16:9"

# ------------------------------------------------------------------ assets
# Everything below is generated by `grub-themes build arachne`. Do not
# hand-edit the generated files -- edit this manifest, or the SVG, and rebuild.

[assets.background]
source = "tools/background.svg"
width  = 1920
height = 1080

[assets.selection]
# A comic-print highlight: red plate on top, cyan plate a few millimetres out
# of register below and to the left. lint checks fill against text.
style     = "pill"
fill      = "#e01b45"
text      = "#ffffff"
radius    = 6
height    = 46          # keep equal to item_height in theme.txt
shadow    = "#2bd9ff"
shadow_dx = -7
shadow_dy = 6

[assets.terminal_box]
# Transparent on purpose -- see AGENTS.md. GRUB draws this box while the kernel
# loads, so any visible fill reads as a slab sitting over the theme.
fill = "transparent"

[assets.progress]
track = "#1c0f38e6"
fill  = "#2bd9ff"

[assets.fonts]
# GRUB matches a font by the name baked inside the .pf2, never by filename.
# `grub-themes build` prints the baked names; theme.txt uses those exactly.
regular    = "JetBrainsMonoNerdFont-Regular.ttf"
bold       = "JetBrainsMonoNerdFont-Bold.ttf"
prefix     = "jetbrains"
sizes      = [12, 14, 20]
bold_sizes = [18]
