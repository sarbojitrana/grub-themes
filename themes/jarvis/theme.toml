# Theme manifest. Every theme in themes/ needs one of these.
# `grub-themes lint` validates it; the TUI reads it to build the browser.

[theme]
id          = "jarvis"
name        = "J.A.R.V.I.S."
description = "Arc-reactor HUD in cyan on blue-black. Menu left, reactor right."
version     = "1.1.0"
license     = "MIT"
tags        = ["dark", "cyan", "minimal", "scifi", "hud"]

[author]
name   = "Sarbojit Rana"
github = "sarbojitrana"

[files]
# Path to the GRUB theme definition, relative to this manifest.
entry   = "theme.txt"
preview = "preview.png"

[display]
# The resolution the art was drawn for. GRUB scales the background, and the
# layout in theme.txt is in percentages, so other 16:9 modes work unchanged.
designed_for = "1920x1080"
aspect       = "16:9"

# ------------------------------------------------------------------ assets
# Everything below is generated by `grub-themes build jarvis`: the background is
# rendered from the SVG, the pixmaps are drawn, the fonts are baked. Do not
# hand-edit the generated files -- edit this manifest, or the SVG, and rebuild.

[assets.background]
source = "tools/background.svg"
width  = 1920
height = 1080

[assets.selection]
style  = "pill"
fill   = "#00d9ff"
# Dark text on the solid cyan pill. lint checks this contrast, because if the
# pill ever fails to render, low-contrast text is what makes the selected entry
# look blanked out instead of highlighted.
text   = "#05202a"
radius = 10
height = 44        # keep equal to item_height in theme.txt

[assets.terminal_box]
# Transparent on purpose -- see AGENTS.md. GRUB draws this box while the kernel
# loads, so any visible fill reads as a slab over the theme.
fill = "transparent"

[assets.progress]
track = "#12202ad9"
fill  = "#00d9ff"

[assets.fonts]
# grub-mkfont bakes a name into each .pf2 and GRUB matches on that name, never
# on the filename. `grub-themes build` prints the names it baked; theme.txt has
# to use those exact strings.
regular    = "JetBrainsMonoNerdFont-Regular.ttf"
bold       = "JetBrainsMonoNerdFont-Bold.ttf"
prefix     = "jetbrains"
sizes      = [12, 14, 20]
bold_sizes = [18]
