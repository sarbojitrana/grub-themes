# Theme manifest. `grub-themes lint` validates it.

[theme]
id          = "jarvis"
name        = "J.A.R.V.I.S."
description = "Arc-reactor HUD in cyan on blue-black. Menu left, reactor right."
version     = "1.1.0"
license     = "MIT"
tags        = ["dark", "cyan", "minimal", "scifi", "hud"]

[author]
name   = "Sarbojit Rana"
github = "sarbojitrana"

[files]
entry   = "theme.txt"
preview = "preview.png"

[display]
# What the art was drawn for; GRUB scales it, and theme.txt is in percentages.
designed_for = "1920x1080"
aspect       = "16:9"

# --- assets: `grub-themes build jarvis` generates all of these ------------

[assets.background]
source = "tools/background.svg"
width  = 1920
height = 1080

[assets.selection]
style  = "pill"
fill   = "#00d9ff"
# lint checks this against fill: low contrast is what makes a failed
# highlight look blanked out rather than wrong.
text   = "#05202a"
radius = 10
height = 44        # keep equal to item_height in theme.txt

[assets.terminal_box]
# Transparent: GRUB draws this box while the kernel loads (see AGENTS.md).
fill = "transparent"

[assets.progress]
track = "#12202ad9"
fill  = "#00d9ff"

[assets.fonts]
# build prints the baked names; theme.txt must use those exactly.
regular    = "JetBrainsMonoNerdFont-Regular.ttf"
bold       = "JetBrainsMonoNerdFont-Bold.ttf"
prefix     = "jetbrains"
sizes      = [12, 14, 20]
bold_sizes = [18]
