# Theme manifest. Every theme in themes/ needs one of these.
# `grub-themes lint` validates it; the browser reads it to build the list.

[theme]
id          = "gotham"
name        = "Gotham"
description = "Bat-signal over a sleeping city. Black, rain and signal yellow."
version     = "1.0.0"
license     = "MIT"
tags        = ["dark", "yellow", "bat", "noir", "minimal"]

[author]
name   = "Sarbojit Rana"
github = "sarbojitrana"

[files]
entry   = "theme.txt"
preview = "preview.png"

[display]
# The resolution the art was drawn for. GRUB scales the background and the
# layout in theme.txt is in percentages, so other 16:9 modes work unchanged.
designed_for = "1920x1080"
aspect       = "16:9"

# ------------------------------------------------------------------ assets
# Everything below is generated by `grub-themes build gotham`. Do not hand-edit
# the generated files -- edit this manifest, or the SVG, and rebuild.

[assets.background]
source = "tools/background.svg"
width  = 1920
height = 1080

[assets.selection]
# Angular, not a pill: a solid slab with a bright leading edge, like a strip of
# light. lint checks fill against text for contrast.
style     = "bar"
fill      = "#ffcf1b"
text      = "#07090c"
radius    = 0
height    = 46          # keep equal to item_height in theme.txt
shadow    = "#fff6d2"   # the leading edge, offset out to the left
shadow_dx = -5

[assets.terminal_box]
# Transparent on purpose -- see AGENTS.md. GRUB draws this box while the kernel
# loads, so any visible fill reads as a slab sitting over the theme.
fill = "transparent"

[assets.progress]
track = "#141a21e6"
fill  = "#ffcf1b"

[assets.fonts]
# GRUB matches a font by the name baked inside the .pf2, never by filename.
# `grub-themes build` prints the baked names; theme.txt uses those exactly.
regular    = "JetBrainsMonoNerdFont-Regular.ttf"
bold       = "JetBrainsMonoNerdFont-Bold.ttf"
prefix     = "jetbrains"
sizes      = [12, 14, 20]
bold_sizes = [18]
