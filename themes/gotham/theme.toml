# Theme manifest. `grub-themes lint` validates it.

[theme]
id          = "gotham"
name        = "Gotham"
description = "Bat-signal over a sleeping city. Black, rain and signal yellow."
version     = "1.0.0"
license     = "MIT"
tags        = ["dark", "yellow", "bat", "noir", "minimal"]

[author]
name   = "Sarbojit Rana"
github = "sarbojitrana"

[files]
entry   = "theme.txt"
preview = "preview.png"

[display]
# What the art was drawn for; GRUB scales it, and theme.txt is in percentages.
designed_for = "1920x1080"
aspect       = "16:9"

# --- assets: `grub-themes build gotham` generates all of these ------------

[assets.background]
source = "tools/background.svg"
width  = 1920
height = 1080

[assets.selection]
# A slab with a bright leading edge. lint checks fill against text.
style     = "bar"
fill      = "#ffcf1b"
text      = "#07090c"
radius    = 0
height    = 46          # keep equal to item_height in theme.txt
shadow    = "#fff6d2"   # the leading edge, offset out to the left
shadow_dx = -5

[assets.terminal_box]
# Transparent: GRUB draws this box while the kernel loads (see AGENTS.md).
fill = "transparent"

[assets.progress]
track = "#141a21e6"
fill  = "#ffcf1b"

[assets.fonts]
# build prints the baked names; theme.txt must use those exactly.
regular    = "JetBrainsMonoNerdFont-Regular.ttf"
bold       = "JetBrainsMonoNerdFont-Bold.ttf"
prefix     = "jetbrains"
sizes      = [12, 14, 20]
bold_sizes = [18]
