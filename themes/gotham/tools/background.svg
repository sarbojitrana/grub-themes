<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!--
    GOTHAM - background art. Re-render with `grub-themes build gotham`.
    Original vector work: a bat silhouette, a signal disc, a generic skyline.
  -->
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#05070b"/>
      <stop offset="42%"  stop-color="#0a1119"/>
      <stop offset="78%"  stop-color="#070d14"/>
      <stop offset="100%" stop-color="#030508"/>
    </linearGradient>
    <radialGradient id="disc" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fff6d2"/>
      <stop offset="38%"  stop-color="#ffd739"/>
      <stop offset="82%"  stop-color="#f5b800"/>
      <stop offset="100%" stop-color="#d99500"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffcf1b" stop-opacity="0.40"/>
      <stop offset="45%"  stop-color="#ffb300" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#ffb300" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0.55" y2="0">
      <stop offset="0%"   stop-color="#ffcf1b" stop-opacity="0.015"/>
      <stop offset="70%"  stop-color="#ffcf1b" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#ffe27a" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0.42"/>
      <stop offset="55%"  stop-color="#000000" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vig" cx="72%" cy="42%" r="82%">
      <stop offset="50%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.62"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="cloudy"><feGaussianBlur stdDeviation="48"/></filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#night)"/>

  <!-- low cloud -->
  <g filter="url(#cloudy)" opacity="0.55">
    <ellipse cx="1330" cy="300" rx="330" ry="105" fill="#16202c"/>
    <ellipse cx="1560" cy="230" rx="260" ry="80"  fill="#111a24"/>
    <ellipse cx="1180" cy="215" rx="210" ry="66"  fill="#0e161f"/>
  </g>

  <!-- the beam -->
  <g filter="url(#soft)">
    <path d="M 250 1090 L 1150 430 L 1660 430 L 470 1090 Z" fill="url(#beam)"/>
  </g>

  <!-- the signal -->
  <g transform="translate(1395,470)">
    <circle r="430" fill="url(#halo)"/>
    <circle r="252" fill="url(#disc)"/>
    <circle r="252" fill="none" stroke="#fff3bd" stroke-width="3" opacity="0.5"/>
    <g fill="#06090d" transform="scale(0.76)">
      <path id="bat" d="M 0 -46 C 10 -46, 14 -52, 17 -62 L 26 -92 C 28 -98, 35 -97, 36 -90 L 42 -54 C 47 -40, 62 -34, 78 -41 C 155 -70, 245 -80, 310 -58 L 286 -24 C 262 -32, 238 -18, 228 10 C 214 -14, 190 -22, 170 -8 C 152 4, 142 26, 138 56 C 122 24, 96 12, 74 26 C 54 39, 40 60, 32 88 C 24 62, 14 50, 0 52 Z"/>
      <use href="#bat" transform="scale(-1,1)"/>
    </g>
  </g>

