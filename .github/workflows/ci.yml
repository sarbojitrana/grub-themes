name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l . )
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...
      - run: go test ./...
      - run: make build

      # Catches GRUB's silent failures before anyone reboots into a broken menu.
      - name: Lint every theme
        run: ./grub-themes lint

      # Attached so a theme can be reviewed without booting anything.
      - name: Render previews
        run: |
          ./grub-themes preview
          mkdir -p previews
          for d in themes/*/; do
            id=$(basename "$d")
            cp "$d/preview.png" "previews/$id.png"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: theme-previews
          path: previews/

      # Reported, not enforced: PNG bytes can shift between toolchain versions.
      - name: Previews are up to date
        continue-on-error: true
        run: git diff --stat --exit-code -- themes/
