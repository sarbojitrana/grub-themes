# Build .deb and .rpm packages:
#
#   make build VERSION=1.0.0
#   nfpm package -f packaging/nfpm.yaml -p deb -t dist/
#   nfpm package -f packaging/nfpm.yaml -p rpm -t dist/
#
# The binary is static. GRUB is only needed to apply a theme, hence a
# recommendation rather than a dependency.
name: grub-themes
arch: amd64
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: Sarbojit Rana <https://github.com/sarbojitrana>
description: |
  Browse GRUB boot themes and apply one safely.
  A terminal browser for GRUB2 themes with previews, validation that catches
  GRUB's silent failure modes, and an installer that backs up and verifies your
  boot configuration before and after regenerating grub.cfg.
vendor: sarbojitrana
homepage: https://github.com/sarbojitrana/grub-themes
license: MIT

recommends:
  - grub2-common
suggests:
  - librsvg2-bin

contents:
  - src: ./grub-themes
    dst: /usr/bin/grub-themes
  - src: ./packaging/grub-themes.desktop
    dst: /usr/share/applications/grub-themes.desktop
  - src: ./packaging/grub-themes.svg
    dst: /usr/share/icons/hicolor/scalable/apps/grub-themes.svg
  - src: ./themes
    dst: /usr/share/grub-themes/themes
    type: tree
  - src: ./README.md
    dst: /usr/share/doc/grub-themes/README.md
  - src: ./docs/build-your-own-theme.md
    dst: /usr/share/doc/grub-themes/build-your-own-theme.md
  - src: ./LICENSE
    dst: /usr/share/licenses/grub-themes/LICENSE
