<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0d151d"/>
      <stop offset="55%"  stop-color="#111c26"/>
      <stop offset="100%" stop-color="#0a1119"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#bff4ff" stop-opacity="0.50"/>
      <stop offset="32%"  stop-color="#00d9ff" stop-opacity="0.30"/>
      <stop offset="70%"  stop-color="#0891a8" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#00d9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#00d9ff" stop-opacity="0.14"/>
      <stop offset="60%"  stop-color="#00d9ff" stop-opacity="0.035"/>
      <stop offset="100%" stop-color="#00d9ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- reactor, centred behind the menu -->
  <g transform="translate(960,560)">
    <circle r="470" fill="url(#halo)"/>
    <circle r="300" fill="none" stroke="#173341" stroke-width="30" opacity="0.85"/>
    <circle r="300" fill="none" stroke="#00d9ff" stroke-width="1.4" opacity="0.30"/>
    <circle r="262" fill="none" stroke="#00d9ff" stroke-width="1"   opacity="0.16"/>
    <g stroke="#00d9ff" stroke-width="10" opacity="0.36" filter="url(#soft)" fill="none">
      <path d="M0 -282 a282 282 0 0 1 141 38"/>
      <path d="M199 -199 a282 282 0 0 1 83 141"/>
      <path d="M282 0 a282 282 0 0 1 -38 141"/>
      <path d="M199 199 a282 282 0 0 1 -141 83"/>
      <path d="M0 282 a282 282 0 0 1 -141 -38"/>
      <path d="M-199 199 a282 282 0 0 1 -83 -141"/>
      <path d="M-282 0 a282 282 0 0 1 38 -141"/>
      <path d="M-199 -199 a282 282 0 0 1 141 -83"/>
    </g>
    <circle r="186" fill="none" stroke="#143039" stroke-width="22" opacity="0.9"/>
    <circle r="186" fill="none" stroke="#00d9ff" stroke-width="1.3" opacity="0.34"/>
    <circle r="158" fill="url(#core)"/>
  </g>

  <!-- HUD frame -->
  <g stroke="#00d9ff" opacity="0.28" fill="none" stroke-width="1.6">
    <path d="M60 60 h120 M60 60 v70"/>
    <path d="M1860 60 h-120 M1860 60 v70"/>
    <path d="M60 1020 h120 M60 1020 v-70"/>
    <path d="M1860 1020 h-120 M1860 1020 v-70"/>
  </g>
  <line x1="60" y1="196" x2="1860" y2="196" stroke="#00d9ff" stroke-width="1" opacity="0.16"/>

  <text x="960" y="128" text-anchor="middle" font-family="monospace" font-size="42"
        letter-spacing="16" fill="#00d9ff" opacity="0.92">J.A.R.V.I.S.</text>
  <text x="960" y="168" text-anchor="middle" font-family="monospace" font-size="17"
        letter-spacing="7" fill="#86a5b3" opacity="0.9">BOOT SEQUENCE — SELECT AN OPERATING SYSTEM</text>
</svg>
